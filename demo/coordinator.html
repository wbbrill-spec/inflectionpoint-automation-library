  .upbar input:not([type=file]) { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

  @media (max-width: 720px) { header, main { padding-left: 14px; padding-right: 14px; } .kv { grid-template-columns: 1fr; } th.hide-sm, td.hide-sm { display: none; } }

let lang = (() => {
    try {

        return "es";

})();

const T = k => I18N[lang][k] ?? I18N.es[k] ?? k;

const LOCALE = () => lang === "en" ? "en-US" : "es-MX";

function applyStatic() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = T(el.dataset.i18n));
    document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = T(el.dataset.i18nPh));
    $("#lang").textContent = lang === "es" ? "EN" : "ES";
    document.title = "Coordinator Dashboard — Demo";
}

const fmtDate = v => v ? new Date(v).toLocaleString(LOCALE(), {

    dateStyle: "medium",
    timeStyle: "short"
}) : "—";

const fmtDay = v => v ? new Date(v).toLocaleDateString(LOCALE(), {
    timeZone: "America/Mexico_City",
    dateStyle: "medium"
}) : "—";

const num = (v, d = 2) => v == null ? "—" : Number(v).toLocaleString(LOCALE(), {
    maximumFractionDigits: d
});

        cls: "critical",

const pill = (m, k) => {
    const x = m[k] || {
        cls: "neutral",
        icon: "·",
        label: k || "—"
    };
    return `<span class="pill ${x.cls}"><span class="dot"></span>${x.icon} ${esc(x.label)}</span>`;
};

const pillC = (cls, icon, label) => `<span class="pill ${cls}"><span class="dot"></span>${icon} ${esc(label)}</span>`;

let state = {
    list: [],
    jobs: [],
    summary: null,
    filter: {
        status: "",
        sla: "",
        coordinator: "",
        q: ""
    },
    tile: null,
    view: "lots",
    mine: (() => {
        try {
            return localStorage.getItem("mine") === "1";
        } catch {
            return false;
        }
    })(),
    team: []
};

function hoursLeft(deadline) {
    if (!deadline) return null;
    return (new Date(deadline) - Date.now()) / 36e5;
}

function countdown(sla, docsComplete) {
    if (docsComplete) return `<span class="muted small">${T("docs_received")}</span>`;
    const h = hoursLeft(sla.deadline);
    if (h == null) return `<span class="muted small">${T("no_load_date")}</span>`;
    if (h < 0) return `<strong>${T("ago")(Math.round(-h))}</strong>`;
    if (h < 48) return `<strong>${T("hours")(Math.round(h))}</strong>`;
    return T("days")(Math.ceil(h / 24));
}

async function guard(r) {
    if (r.status === 401) {
        throw new Error("sign in");
    }
    return r;
}

function myCode() {
    const me = state.me && state.me.user && state.me.user.email && state.me.user.email.toLowerCase();
    if (!me || !state.summary) return null;
    const c = (state.summary.by_coordinator || []).find(x => x.email === me);
    return c ? c.code : null;
}

async function load() {
    if (state.mine && state.summary) {
        const mc = myCode();
        if (mc) {
            state.filter.coordinator = mc;
            $("#f-coord").value = mc;
        }
    }
    const p = new URLSearchParams(Object.entries(state.filter).filter(([, v]) => v));
    const pj = new URLSearchParams(Object.entries({
        q: state.filter.q,
        coordinator: state.filter.coordinator
    }).filter(([, v]) => v));
    const [list, summary, jobs] = await Promise.all([ fetch("/api/audits?" + p).then(guard).then(r => r.json()), fetch("/api/audits/summary").then(guard).then(r => r.json()), fetch("/api/audits/jobs?" + pj).then(guard).then(r => r.json()) ]);
    if (list.error) {
        $("#board").innerHTML = `<div class="empty">${esc(list.error)}</div>`;
        return;
    }
    state.list = list;
    state.summary = summary;
    state.jobs = Array.isArray(jobs) ? jobs : [];
    render();
}

function closeDrawer() {
    $("#overlay").classList.remove("open");
    $("#drawer").classList.remove("open");
}

async function post(url, body) {
    try {
        return await fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
        }).then(r => r.json());
    } catch (e) {
        return {
            error: e.message
        };
    }
}

let toastT;

function toast(m) {
    if (window.__ipnDemoHold && Date.now() < window.__ipnDemoHold) m = "Demo only — no changes are saved";
    const t = $("#toast");
    t.textContent = m;
    t.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove("show"), 3500);
}

        state.team = t.coordinators || [];
        state.fallback = t.fallback;
    } catch {
        state.team = [];
    }
}

async function renderTeam() {
    await loadTeam();
    const L = await fetch("/api/audits/ladders").then(r => r.json()).catch(() => ({
        default: [],
        ladders: []
    }));
    const tk = T("team_token");
    const rows = state.team.map(c => `<tr>\n    <td>${esc(c.name || "—")}</td><td>${esc(c.email)}</td><td>${esc(c.code || "")}</td>\n    <td>${c.active ? pillC("good", "✓", T("team_active")) : pillC("critical", "✕", T("team_inactive"))}<div class="muted small">${esc(tk[c.token_status] || tk.none)}${c.deactivated_reason ? " · " + esc(c.deactivated_reason) : ""}</div></td>\n    <td class="num">${c.open_jobs}</td><td class="small">${c.last_login_at ? fmtDate(c.last_login_at) : "—"}</td>\n    <td><button class="btn small" data-act="toggle" data-email="${esc(c.email)}" data-active="${c.active ? 1 : 0}">${c.active ? T("team_deactivate") : T("team_activate")}</button>\n      ${c.open_jobs ? ` <select data-reassign-from="${esc(c.email)}"><option value="">${T("team_reassign_to")}</option>${state.team.filter(x => x.active && x.email !== c.email).map(x => `<option value="${esc(x.email)}">${esc(x.name || x.email)}</option>`).join("")}</select> <button class="btn small" data-act="reassign" data-email="${esc(c.email)}">${T("team_reassign")}</button>` : ""}</td>\n  </tr>`).join("");
    const ladderRow = (l, idx) => `<div class="ladder-row" data-ladder-id="${l.id || ""}">\n    <input placeholder="${esc(T("team_ladder_pattern"))}" data-f="client_pattern" value="${esc(l.client_pattern || "")}">\n    <input placeholder="${esc(T("team_ladder_label"))}" data-f="label" value="${esc(l.label || "")}">\n    ${[ 0, 1, 2, 3 ].map(i => {
        const x = (l.ladder || [])[i] || {};
        return `<input placeholder="${esc(T("team_ladder_name")(i + 1))}" data-f="name${i}" value="${esc(x.name || "")}"><input placeholder="${esc(T("team_ladder_email"))}" data-f="email${i}" value="${esc(x.email || "")}">`;
    }).join("")}\n    <span><button class="btn small primary" data-act="ladder-save">${T("team_ladder_save")}</button> ${l.id ? `<button class="btn small danger" data-act="ladder-del" data-id="${l.id}">${T("team_ladder_delete")}</button>` : ""}</span>\n  </div>`;
    $("#team").innerHTML = `\n    <div><h3>${T("team_coords")}</h3><div class="note" style="margin-bottom:8px">${esc(T("team_fallback")(state.fallback || ""))}</div>\n      ${state.team.length ? `<table><thead><tr><th>${T("team_h_name")}</th><th>${T("team_h_email")}</th><th>${T("team_h_code")}</th><th>${T("team_h_status")}</th><th>${T("team_h_open")}</th><th>${T("team_h_login")}</th><th>${T("team_h_actions")}</th></tr></thead><tbody>${rows}</tbody></table>` : `<div class="note">${esc(T("team_none"))}</div>`}</div>\n    <div><h3>${T("team_ladders")}</h3><div class="note" style="margin-bottom:8px">${esc(T("team_ladders_intro"))}${(L.default || []).map(l => `${l.level}. ${esc(l.name)}${l.email ? " (" + esc(l.email) + ")" : ""}`).join(" → ")}</div>\n      <div id="ladders">${(L.ladders || []).map(ladderRow).join("")}</div>\n      <button class="btn small" id="ladder-add">${T("team_ladder_add")}</button></div>`;
    $("#team").querySelectorAll("button[data-act]").forEach(b => b.onclick = async () => {
        const act = b.dataset.act;
        if (act === "toggle") {
            const active = b.dataset.active !== "1";
            const reason = active ? "" : prompt(T("team_reason_prompt")) ?? null;
            if (!active && reason === null) return;
            const r = await post("/api/audits/team/active", {
                email: b.dataset.email,
                active: active,
                reason: reason,
                by: state.me && state.me.user && state.me.user.email || $("#who")?.value
            });
            if (r.error) return toast(r.error);
            renderTeam();
            load();
        } else if (act === "reassign") {
            const to = $("#team").querySelector(`select[data-reassign-from="${CSS.escape(b.dataset.email)}"]`).value;
            if (!to) return;
            const r = await post("/api/audits/team/reassign", {
                from: b.dataset.email,
                to: to,
                by: state.me && state.me.user && state.me.user.email || null
            });
            if (r.error) return toast(r.error);
            toast(T("team_reassigned")(r.moved));
            renderTeam();
            load();
        } else if (act === "ladder-save") {
            const row = b.closest(".ladder-row");
            const f = k => row.querySelector(`[data-f="${k}"]`).value.trim();
            const ladder = [ 0, 1, 2, 3 ].map(i => ({
                name: f("name" + i),
                email: f("email" + i)
            })).filter(x => x.name);
            const r = await fetch("/api/audits/ladders", {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    id: row.dataset.ladderId ? Number(row.dataset.ladderId) : null,
                    client_pattern: f("client_pattern"),
                    label: f("label"),
                    ladder: ladder,
                    by: state.me && state.me.user && state.me.user.email || null
                })
            }).then(r => r.json());
            if (r.error) return toast(r.error);
            toast(T("team_ladder_saved"));
            renderTeam();
            load();
        } else if (act === "ladder-del") {
            const r = await fetch(`/api/audits/ladders/${b.dataset.id}`, {
                method: "DELETE"
            }).then(r => r.json());
            if (r.error) return toast(r.error);
            renderTeam();
            load();
        }
    });
    $("#ladder-add").onclick = () => {
        $("#ladders").insertAdjacentHTML("beforeend", ladderRow({}, 0));
        const nb = $("#ladders").lastElementChild.querySelector('[data-act="ladder-save"]');
        if (nb) nb.onclick = () => fetch("/api/audits/ladders", {
            method: "PUT",
            body: "{}"
        });
    };
}

    const btn = $("#up-send");
    btn.disabled = true;
    $("#up-status").textContent = T("up_sending");
    try {
        const r = await fetch("/api/audits/ingest", {
            method: "POST",
            body: fd
        });
        const j = await r.json().catch(() => ({}));
        if (j.duplicate) {
            $("#up-status").textContent = T("up_dup");
        } else if (j.code === "no_reference") {
            $("#up-status").textContent = T("up_noref");
            $("#up-ref").focus();
        } else if (!r.ok || j.error) {
            $("#up-status").textContent = `${T("up_err")}: ${j.error || r.status}`;
        } else {
            $("#up-status").textContent = T("up_ok")(j.job_reference);
            toast(T("up_ok")(j.job_reference));
            $("#up-files").value = "";
            $("#up-ref").value = "";
            await load();
            if (j.job_audit && j.job_audit.id) openDrawer(j.job_audit.id);
        }
    } catch (e) {
        $("#up-status").textContent = `${T("up_err")}: ${e.message}`;
    }
    btn.disabled = false;
};

applyStatic();

fetch("/api/audits/env").then(r => r.ok ? r.json() : null).then(e => {
    state.env = e;
    setEnvNote();
}).catch(() => {});

fetch("/auth/me").then(r => r.ok ? r.json() : null).then(m => {
    state.me = m;
    if (m && m.user) $("#whoami").textContent = `${m.user.name || m.user.email} · Demo Movers Co.`;
    loadTeam();
}).catch(() => {});

setTimeout(checkDead, 2500);

load().then(() => {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h) openDrawer(h);
});

window.addEventListener("hashchange", () => {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h) openDrawer(h);
});

setInterval(load, 12e4);
</script>
</body>
</html>
