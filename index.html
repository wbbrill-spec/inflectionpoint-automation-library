<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>InflectionPoint Automation Library</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* InflectionPoint Now brand — matches inflectionpointnow.com: Public Sans, white, black, blue #0073CF, navy #07182A */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
--blue: #0073CF;
--blue-dark: #005FAE;
--navy: #07182A;
--ink: #0B1420;
--body: #2B3542;
--muted: #55606E;
--page: #F4F6F9;
--surface: #FFFFFF;
--line: #DFE5EC;
--status-live: #1B8754;
--status-progress: #B26A00;
--status-planned: #3B6EA8;
}

body {
font-family: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
background-color: var(--page);
color: var(--ink);
min-height: 100vh;
display: flex;
flex-direction: column;
-webkit-font-smoothing: antialiased;
}

/* HEADER */
header {
display: flex;
align-items: center;
justify-content: space-between;
padding: 18px 48px;
border-bottom: 1px solid var(--line);
background: rgba(255,255,255,0.96);
position: sticky;
top: 0;
z-index: 100;
backdrop-filter: blur(8px);
}

.logo-wrap img {
height: 46px;
width: auto;
display: block;
}

.header-title {
font-size: 12px;
font-weight: 600;
letter-spacing: 0.2em;
text-transform: uppercase;
color: var(--muted);
}

/* HERO */
.hero {
padding: 72px 48px 64px;
position: relative;
overflow: hidden;
color: #fff;
background:
radial-gradient(ellipse 60% 120% at 12% 50%, #0A395A 0%, rgba(10,57,90,0) 70%),
repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 2px, rgba(255,255,255,0) 2px 26px),
var(--navy);
}

.hero-eyebrow {
font-size: 12px;
font-weight: 700;
letter-spacing: 0.24em;
text-transform: uppercase;
color: #6DB6F2;
margin-bottom: 16px;
}

.hero-title {
font-size: clamp(36px, 5vw, 58px);
font-weight: 700;
line-height: 1.06;
letter-spacing: -0.04em;
color: #fff;
margin-bottom: 20px;
max-width: 700px;
}

.hero-title em {
font-style: normal;
color: #6DB6F2;
}

.hero-description {
font-size: 17px;
font-weight: 400;
color: #C9D6E3;
line-height: 1.6;
max-width: 560px;
}

/* STATS BAR */
.stats-bar {
display: flex;
gap: 0;
padding: 0 48px;
background: var(--surface);
border-bottom: 1px solid var(--line);
}

.stat {
display: flex;
align-items: center;
gap: 10px;
padding: 18px 32px 18px 0;
margin-right: 32px;
border-right: 1px solid var(--line);
}

.stat:last-child {
border-right: none;
}

.stat-dot {
width: 9px;
height: 9px;
border-radius: 50%;
flex-shrink: 0;
}

.stat-dot.live { background: var(--status-live); }
.stat-dot.progress { background: var(--status-progress); }
.stat-dot.planned { background: var(--status-planned); }

.stat-label {
font-size: 13px;
font-weight: 500;
color: var(--muted);
}

.stat-count {
font-size: 20px;
font-weight: 700;
color: var(--ink);
margin-left: 4px;
}

/* SECTIONS */
.library {
padding: 16px 48px 56px;
flex: 1;
}

.group { padding-top: 40px; }

.group-head {
display: flex;
align-items: baseline;
gap: 14px;
flex-wrap: wrap;
margin-bottom: 6px;
}

.group-title {
font-size: 28px;
font-weight: 700;
letter-spacing: -0.035em;
line-height: 1.15;
color: var(--ink);
}

.group-count {
font-size: 12px;
font-weight: 700;
letter-spacing: 0.14em;
text-transform: uppercase;
color: var(--blue);
}

.group-note {
font-size: 15px;
color: var(--muted);
line-height: 1.55;
max-width: 70ch;
margin-bottom: 20px;
}

.group-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
gap: 24px;
}

/* CARD */
.card {
background: var(--surface);
border: 1px solid var(--line);
border-radius: 14px;
display: flex;
flex-direction: column;
overflow: hidden;
box-shadow: 0 6px 20px rgba(7,24,42,0.05);
transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
position: relative;
}

.card::before {
content: '';
position: absolute;
top: 0; left: 0; right: 0;
height: 4px;
background: var(--blue);
opacity: 0;
transition: opacity 0.2s ease;
}

.card:hover {
border-color: #B9CBE0;
transform: translateY(-2px);
box-shadow: 0 12px 30px rgba(7,24,42,0.10);
}

.card:hover::before {
opacity: 1;
}

.card-header {
padding: 26px 28px 18px;
border-bottom: 1px solid var(--line);
display: flex;
align-items: flex-start;
justify-content: space-between;
gap: 16px;
}

.card-title-block { flex: 1; }

.card-title {
font-size: 22px;
font-weight: 700;
letter-spacing: -0.03em;
color: var(--ink);
line-height: 1.2;
margin-bottom: 6px;
}

.card-subtitle {
font-size: 11px;
font-weight: 600;
letter-spacing: 0.14em;
text-transform: uppercase;
color: var(--muted);
line-height: 1.5;
}

.status-badge {
display: flex;
align-items: center;
gap: 6px;
padding: 5px 10px;
border-radius: 999px;
font-size: 10.5px;
font-weight: 700;
letter-spacing: 0.1em;
text-transform: uppercase;
white-space: nowrap;
flex-shrink: 0;
}

.status-badge.live {
background: #E6F4EC;
color: var(--status-live);
border: 1px solid #BFE3CF;
}

.status-badge.progress {
background: #FFF3DF;
color: var(--status-progress);
border: 1px solid #F3D9A6;
}

.status-badge.planned {
background: #E8F0F9;
color: var(--status-planned);
border: 1px solid #C5D7EC;
}

.status-dot {
width: 6px; height: 6px;
border-radius: 50%;
background: currentColor;
}

.status-dot.live { animation: pulse 2s infinite; }

@keyframes pulse {
0%, 100% { opacity: 1; }
50% { opacity: 0.4; }
}

/* CARD BODY */
.card-body {
padding: 20px 28px 24px;
flex: 1;
display: flex;
flex-direction: column;
gap: 16px;
}

.card-description {
font-size: 14.5px;
font-weight: 400;
color: var(--body);
line-height: 1.65;
}

/* LIVE STATS STRIP (JobScout) */
.live-stats {
display: flex;
flex-wrap: wrap;
gap: 0;
border: 1px solid var(--line);
border-radius: 10px;
background: #F7FAFD;
overflow: hidden;
}
.live-stats .ls-cell {
flex: 1 1 auto;
min-width: 62px;
padding: 10px 14px;
border-right: 1px solid var(--line);
text-align: center;
}
.live-stats .ls-cell:last-child { border-right: none; }
.live-stats .ls-n {
font-size: 21px;
font-weight: 700;
letter-spacing: -0.02em;
color: var(--blue);
line-height: 1;
}
.live-stats .ls-l {
font-size: 9.5px;
font-weight: 600;
letter-spacing: 0.1em;
text-transform: uppercase;
color: var(--muted);
margin-top: 5px;
}
.live-stats.loading .ls-n { color: #9AA6B4; }
.live-stats-caption {
font-size: 11px;
font-weight: 600;
letter-spacing: 0.08em;
text-transform: uppercase;
color: var(--muted);
margin-bottom: -6px;
display: flex;
align-items: center;
gap: 7px;
}
.live-stats-caption .dot {
width: 7px; height: 7px; border-radius: 50%;
background: var(--status-live);
}

/* PIPELINE */
.pipeline {
display: flex;
align-items: center;
gap: 0;
flex-wrap: wrap;
row-gap: 8px;
}

.pipeline-step {
font-size: 10.5px;
font-weight: 600;
letter-spacing: 0.06em;
text-transform: uppercase;
color: var(--muted);
background: #F1F4F8;
border: 1px solid var(--line);
padding: 4px 10px;
border-radius: 6px;
}

.pipeline-arrow {
font-size: 11px;
color: var(--blue);
padding: 0 6px;
}

/* META ROW */
.card-meta {
display: flex;
gap: 20px;
flex-wrap: wrap;
}

.meta-item {
display: flex;
flex-direction: column;
gap: 3px;
}

.meta-label {
font-size: 10px;
font-weight: 700;
letter-spacing: 0.14em;
text-transform: uppercase;
color: #7A8696;
}

.meta-value {
font-size: 13px;
font-weight: 400;
color: var(--body);
}

/* CARD FOOTER */
.card-footer {
padding: 16px 28px;
border-top: 1px solid var(--line);
display: flex;
align-items: center;
justify-content: space-between;
gap: 12px;
}

.btn-run {
display: inline-flex;
align-items: center;
gap: 8px;
padding: 11px 20px;
background: var(--blue);
border: 1px solid var(--blue);
color: #fff;
font-family: inherit;
font-size: 13px;
font-weight: 700;
cursor: pointer;
border-radius: 8px;
transition: background 0.2s ease, border-color 0.2s ease;
text-decoration: none;
}

.btn-run:hover {
background: var(--blue-dark);
border-color: var(--blue-dark);
}

.btn-run:disabled {
background: #EEF1F5;
border-color: var(--line);
color: #8A95A3;
cursor: not-allowed;
}

.btn-run svg {
width: 11px; height: 11px;
}

.btn-view {
font-size: 13px;
font-weight: 600;
color: var(--blue);
text-decoration: none;
}

.btn-view:hover { color: var(--blue-dark); text-decoration: underline; }

/* TOAST */
.toast {
position: fixed;
bottom: 32px;
right: 32px;
background: var(--navy);
border-left: 4px solid var(--blue);
padding: 14px 20px;
font-size: 14px;
color: #fff;
border-radius: 8px;
box-shadow: 0 10px 32px rgba(7,24,42,0.3);
transform: translateY(80px);
opacity: 0;
transition: all 0.3s ease;
z-index: 999;
max-width: 320px;
}

.toast.show {
transform: translateY(0);
opacity: 1;
}

/* FOOTER */
footer {
padding: 20px 48px;
border-top: 1px solid var(--line);
background: var(--surface);
display: flex;
align-items: center;
justify-content: space-between;
}

.footer-text {
font-size: 12px;
color: var(--muted);
}

@media (max-width: 600px) {
header, .hero, .stats-bar, .library, footer { padding-left: 20px; padding-right: 20px; }
.hero { padding-top: 48px; padding-bottom: 44px; }
.group-grid { grid-template-columns: 1fr; }
.group-title { font-size: 24px; }
.stats-bar { flex-wrap: wrap; }
.logo-wrap img { height: 38px; }
}
</style>
</head>
<body>

<header>
<div class="logo-wrap">
<img src="logo.png" alt="InflectionPoint Now" />
</div>
<div class="header-title">Automation Library</div>
</header>

<section class="hero">
<div class="hero-eyebrow">InflectionOS</div>
<h1 class="hero-title">Every automation,<br/><em>one place.</em></h1>
<p class="hero-description">A living reference for the systems running InflectionPoint Now — what they do, how they work, and how to run them.</p>
</section>

<div class="stats-bar">
<div class="stat">
<div class="stat-dot live"></div>
<span class="stat-label">Live</span>
<span class="stat-count" id="count-live">1</span>
</div>
<div class="stat">
<div class="stat-dot progress"></div>
<span class="stat-label">In Progress</span>
<span class="stat-count" id="count-progress">1</span>
</div>
<div class="stat">
<div class="stat-dot planned"></div>
<span class="stat-label">Planned</span>
<span class="stat-count" id="count-planned">0</span>
</div>
</div>

<main class="library" id="library"></main>

<footer>
<span class="footer-text">InflectionPoint Now &mdash; Internal Use Only</span>
<span class="footer-text" id="last-updated"></span>
</footer>

<div class="toast" id="toast"></div>

<script>
/* Tile sections, in display order. Each automation below names its section in "group". */
const GROUPS = [
{ id: "clients", title: "Win and onboard clients", note: "Tools to use with prospects and new clients: run the discovery meeting, then set the company up." },
{ id: "business", title: "Run the business", note: "The systems that keep InflectionPoint Now moving day to day: planning, daily operations, pipeline and content." },
{ id: "ventures", title: "Other ventures", note: "Automations for businesses outside InflectionPoint Now." }
];

const AUTOMATIONS = [
{
id: "boardroom",
group: "business",
title: "AI Executive Team",
subtitle: "Boardroom · COO · CFO · CTO · CRO · CMO",
status: "progress",
description: "Your AI executive team guiding InflectionPoint toward $125k in 2027 (non-Thelsa consulting + AI automation). View each role's charter, the weekly accountability scorecard, plan vs. actual, the pipeline, product-productization scoring, and the execs' recommendations. Meets you every Monday 9:00 AM.",
pipeline: ["Claude", "Google Sheets", "Gmail"],
schedule: "Mondays · 9:00 AM CT (board meeting)",
platform: "Claude + Google Sheets",
runnable: false,
dashboardUrl: "/boardroom.html"
},
{
id: "client-diagnostic",
group: "clients",
title: "Client Diagnostic Studio",
subtitle: "Prospect Discovery · Automation Opportunity Map",
status: "live",
description: "A live discovery tool for new-client meetings. Walk a prospect through a six-phase Discovery Arc — Business Snapshot, Operations, Tech Stack, Pain Points, Automation Opportunity Map, and Value/ROI + 90-Day Roadmap — scoring four lenses (Automation Readiness, Data Quality, ROI Potential, Scalability) and tagging insights as you talk. Export a tailored diagnostic report. Modeled on a consultative discovery studio, themed for InflectionPoint.",
pipeline: ["Discovery Arc", "4 Lenses", "Capture Tags", "Export Report"],
schedule: "On demand",
platform: "Render.com",
runnable: false,
dashboardUrl: "/diagnostic.html"
},
{
id: "client-onboarding",
group: "clients",
title: "Client Onboarding Wizard",
subtitle: "QuoteRelay · New Company Setup",
status: "live",
description: "Set up a new moving company on the quote automation: company details, connected platforms (MATT mailbox, Moveware, Microsoft 365), salespeople and rules. Their IT person sends keys through a one-time secure link; keys are stored encrypted. Connection tests must pass before the company can be switched live. Sign-in required — operator only.",
pipeline: ["Company", "Platforms", "People", "Rules", "Secure keys", "Go live"],
schedule: "On demand",
platform: "Render.com",
runnable: false,
dashboardUrl: "https://mattapp.inflectionpointnow.com/admin/onboard",
buttonLabel: "Launch Wizard",
newTab: true
},
{
id: "jobscout",
group: "business",
title: "Job & Gig Scout",
subtitle: "Upwork + LinkedIn Opportunity Scout",
status: "progress",
description: "Scans Upwork gigs and LinkedIn roles at or above your rate floor, scores each to fit, and drafts tailored proposals in your voice for one-click review and send. Draft-and-approve — nothing is submitted automatically.",
pipeline: ["Upwork", "LinkedIn", "Claude", "Google Sheets", "Gmail"],
schedule: "Weekday mornings · CT (pending first run)",
platform: "Claude + Google Sheets",
runnable: false,
dashboardUrl: "/jobscout.html",
liveStats: "jobscout"
},
{
id: "ai-personal-assistant",
group: "business",
title: "AI Personal Assistant",
subtitle: "Daily Ops Command Center",
status: "progress",
description: "Weekday scan of four inboxes (inbox + sent), Otter.ai meetings, and every Claude project. Drafts suggested replies, auto-queues follow-ups (agreed timeline or 48h, second on the same cadence, then flags), surfaces meeting commitments from Otter with alerts, and keeps each project moving through the Production → Development & Staging → Architecture & Planning funnel. Delivers a 9:00 AM brief to bill.brill@inflectionpointnow.com.",
pipeline: ["Gmail ×4", "Otter.ai", "Claude", "Google Sheets", "Gmail"],
schedule: "Weekdays · 9:00 AM CST",
platform: "Claude + Google Sheets",
runnable: false,
dashboardUrl: "/assistant.html"
},
{
id: "padco-parts-scan",
group: "ventures",
title: "PADCO Parts Scan",
subtitle: "Daily Marketplace Scanner",
status: "live",
description: "Scans Facebook Marketplace each weekday for junior drum sets (16\" bass, 6 lugs, non-chrome hoop) and vintage Samsonite suitcases within spec, price, and distance of Katy, TX. Matches are logged to Google Sheets, surfaced on the dashboard, and emailed daily to info@panamericandrums.com.",
pipeline: ["Facebook Marketplace", "Claude", "Google Sheets", "SendGrid"],
schedule: "Weekdays · 9:00 AM CST",
platform: "Claude + Google Sheets",
runnable: false,
dashboardUrl: "/padco.html"
},
{
id: "inflectionos-daily-brief",
group: "business",
title: "InflectionOS",
subtitle: "Daily Content Brief",
status: "live",
description: "Pulls an unprocessed topic from the Topic Inbox each morning, generates a structured content brief via AI, and delivers it to Bill's inbox — complete with source context, a summary of the topic's relevance to InflectionPoint Now, and a ready-to-refine social media draft.",
pipeline: ["Google Sheets", "OpenAI", "Gmail", "Google Sheets"],
schedule: "Daily · 7:00 AM CST",
platform: "Make.com",
scenarioId: "5156133",
runnable: true,
makeUrl: "https://us2.make.com/5156133/edit"
}
];

function statusLabel(s) {
const map = { live: "Live", progress: "In Progress", planned: "Planned" };
return map[s] || s;
}

function buildCard(auto) {
const pipelineHTML = auto.pipeline.map((step, i) =>
`<span class="pipeline-step">${step}</span>${i < auto.pipeline.length - 1 ? '<span class="pipeline-arrow">›</span>' : ''}`
).join('');

const liveStatsHTML = auto.liveStats
? `<div class="live-stats-caption"><span class="dot"></span> Live pipeline</div>
<div class="live-stats loading" id="livestats-${auto.liveStats}">
<div class="ls-cell"><div class="ls-n" data-k="total">·</div><div class="ls-l">Matches</div></div>
<div class="ls-cell"><div class="ls-n" data-k="new">·</div><div class="ls-l">New</div></div>
<div class="ls-cell"><div class="ls-n" data-k="applied">·</div><div class="ls-l">Applied</div></div>
<div class="ls-cell"><div class="ls-n" data-k="declined">·</div><div class="ls-l">Declined</div></div>
<div class="ls-cell"><div class="ls-n" data-k="floor">·</div><div class="ls-l">≥ Floor</div></div>
<div class="ls-cell"><div class="ls-n" data-k="avg">·</div><div class="ls-l">Avg score</div></div>
</div>`
: '';

const runBtn = auto.dashboardUrl
? `<a class="btn-run" href="${auto.dashboardUrl}"${auto.newTab ? ' target="_blank" rel="noopener"' : ''}>
<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
<polygon points="2,1 11,6 2,11" fill="currentColor" stroke="none"/>
</svg>
${auto.buttonLabel || "Open Dashboard"}
</a>`
: auto.runnable
? `<button class="btn-run" onclick="triggerRun('${auto.id}')">
<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
<polygon points="2,1 11,6 2,11" fill="currentColor" stroke="none"/>
</svg>
Run Automation Now
</button>`
: `<button class="btn-run" disabled>
<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
<polygon points="2,1 11,6 2,11" fill="currentColor" stroke="none"/>
</svg>
Not Yet Available
</button>`;

const viewLink = auto.makeUrl
? `<a class="btn-view" href="${auto.makeUrl}" target="_blank">View in Make.com →</a>`
: '';

return `
<div class="card" id="card-${auto.id}">
<div class="card-header">
<div class="card-title-block">
<div class="card-title">${auto.title}</div>
<div class="card-subtitle">${auto.subtitle}</div>
</div>
<div class="status-badge ${auto.status}">
<div class="status-dot ${auto.status}"></div>
${statusLabel(auto.status)}
</div>
</div>
<div class="card-body">
<p class="card-description">${auto.description}</p>
${liveStatsHTML}
<div class="pipeline">${pipelineHTML}</div>
<div class="card-meta">
<div class="meta-item">
<span class="meta-label">Schedule</span>
<span class="meta-value">${auto.schedule}</span>
</div>
<div class="meta-item">
<span class="meta-label">Platform</span>
<span class="meta-value">${auto.platform}</span>
</div>
</div>
</div>
<div class="card-footer">
${runBtn}
${viewLink}
</div>
</div>`;
}

function triggerRun(id) {
const auto = AUTOMATIONS.find(a => a.id === id);
if (!auto) return;
showToast(`Running "${auto.title}" — check your inbox shortly.`);
}

function showToast(msg) {
const t = document.getElementById('toast');
t.textContent = msg;
t.classList.add('show');
setTimeout(() => t.classList.remove('show'), 3500);
}

/* ---- JobScout live stats (reads the jobscout tab of the ops data sheet) ---- */
const JOBSCOUT_CSV = "https://docs.google.com/spreadsheets/d/1ExqJR6K-ez41VTr6iwwOCSgX_iYqYatkST79RY39PYk/gviz/tq?tqx=out:csv&sheet=jobscout";

function miniParseCSV(text){
var rows=[], row=[], field="", i=0, inQ=false, c;
while(i<text.length){
c=text[i];
if(inQ){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else {inQ=false;} } else field+=c; }
else { if(c==='"') inQ=true; else if(c===',') { row.push(field); field=""; }
else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=""; }
else if(c==='\r'){} else field+=c; }
i++;
}
if(field.length||row.length){ row.push(field); rows.push(row); }
return rows;
}

function loadJobscoutStats(){
const box = document.getElementById('livestats-jobscout');
if(!box) return;
fetch(JOBSCOUT_CSV, {cache:"no-store"}).then(function(r){ return r.text(); }).then(function(txt){
var rows = miniParseCSV(txt);
var header = (rows[0]||[]).map(function(h){return h.trim();});
var iStatus = header.indexOf('status'), iScore = header.indexOf('score'), iOk = header.indexOf('comp_ok'), iId = header.indexOf('id');
if(iId<0 || iScore<0){ return; } // tab not populated; leave placeholders
var objs = rows.slice(1).filter(function(r){ return r.some(function(v){return v&&v.trim();}); });
var overrides={}; try{ overrides=JSON.parse(localStorage.getItem('jobscout_status_overrides_v1')||'{}')||{}; }catch(e){}
var total=objs.length, nNew=0, nApplied=0, nDeclined=0, nFloor=0, sScore=0, cScore=0;
objs.forEach(function(r){
var rid=(iId>-1?(r[iId]||'').trim():'');
var st=((overrides[rid] || (r[iStatus]||'').trim() || 'new')).toLowerCase();
if(st==='new') nNew++; else if(st==='applied') nApplied++; else if(st==='declined') nDeclined++;
if(iOk>-1 && (r[iOk]||'').trim().toUpperCase()==='TRUE') nFloor++;
var sc=parseFloat((r[iScore]||'').replace(/[^0-9.]/g,''));
if(!isNaN(sc) && sc>0){ sScore+=sc; cScore++; }
});
var avg = cScore? Math.round(sScore/cScore) : 0;
var vals = { total: total, "new": nNew, applied: nApplied, declined: nDeclined, floor: nFloor, avg: avg };
box.classList.remove('loading');
box.querySelectorAll('.ls-n').forEach(function(el){
var k = el.getAttribute('data-k');
el.textContent = (vals[k] !== undefined) ? vals[k] : '·';
});
}).catch(function(){ /* leave placeholders on failure */ });
}

function init() {
const lib = document.getElementById('library');
const known = GROUPS.map(g => g.id);
const sections = GROUPS.map(g => ({ g: g, items: AUTOMATIONS.filter(a => a.group === g.id) }));
const loose = AUTOMATIONS.filter(a => known.indexOf(a.group) === -1);
if (loose.length) sections.push({ g: { id: "other", title: "Other", note: "" }, items: loose });
lib.innerHTML = sections.filter(s => s.items.length).map(s => `
<section class="group" id="group-${s.g.id}">
<div class="group-head">
<h2 class="group-title">${s.g.title}</h2>
<span class="group-count">${s.items.length} ${s.items.length === 1 ? 'tool' : 'tools'}</span>
</div>
${s.g.note ? `<p class="group-note">${s.g.note}</p>` : ''}
<div class="group-grid">${s.items.map(buildCard).join('')}</div>
</section>`).join('');

document.getElementById('count-live').textContent = AUTOMATIONS.filter(a => a.status === 'live').length;
document.getElementById('count-progress').textContent = AUTOMATIONS.filter(a => a.status === 'progress').length;
document.getElementById('count-planned').textContent = AUTOMATIONS.filter(a => a.status === 'planned').length;

const now = new Date();
document.getElementById('last-updated').textContent =
`Updated ${now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;

loadJobscoutStats();
}

init();
</script>
</body>
</html>
